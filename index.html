<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Useful sentences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --mute: #6B6B6B;
    --line: #E6E6E6;
    --lime: #C8F04B;
    --violet: #5B3DF5;
    --chip: #F2F2F2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    font-size: 18px; line-height: 1.3;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header { padding: 22px 18px 10px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  h1 span { display: inline-block; background: var(--lime); padding: 0 6px; border-radius: 6px; }
  header small { display: block; margin-top: 6px; font-size: 13px; color: var(--mute); font-weight: 600; }

  .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 6px 0 2px; border-bottom: 1px solid var(--line); }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); padding: 6px 18px 2px; }
  .row { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding: 4px 18px 10px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; border-radius: 10px;
    background: var(--chip); color: var(--ink);
    padding: 9px 13px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .row.fn .chip[aria-pressed="true"] { background: var(--violet); }
  .chip:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

  main { padding: 8px 12px 48px; }
  .lesson { margin: 18px 6px 8px; font-size: 13px; font-weight: 700; color: var(--mute); }
  .lesson b { color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .say {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: #fff; border: 2px solid var(--ink); border-radius: 14px;
    padding: 12px 12px 12px 14px; text-align: left;
    font: inherit; font-weight: 500; color: inherit; cursor: pointer; min-height: 64px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .say:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .say.playing { background: var(--lime); }
  .say:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
  .text { flex: 1; }
  .fn { display: block; font-size: 12px; color: var(--mute); font-weight: 700; margin-top: 2px; }
  .play {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    background: var(--ink); position: relative;
  }
  .play::after {
    content: ""; position: absolute; left: 15px; top: 11px;
    border-left: 12px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent;
  }
  .say.playing .play { background: var(--violet); }
  .empty { margin: 40px 6px; color: var(--mute); }
</style>
</head>
<body>

<header>
  <h1><span>Useful</span> sentences</h1>
  <small>tap · listen · say it</small>
</header>

<div class="filters">
  <div class="label">Topic</div>
  <div class="row" id="topicRow"></div>
  <div class="label">I want to...</div>
  <div class="row fn" id="fnRow"></div>
</div>

<main><div id="list"></div></main>

<script src="frases.js"></script>
<script>
(function () {
  const topicRow = document.getElementById('topicRow');
  const fnRow = document.getElementById('fnRow');
  const list = document.getElementById('list');
  let topic = 'all', fn = 'all';

  const topicsOf = s => LESSONS[s.lesson] || [];
  const allTopics = [...new Set(Object.values(LESSONS).flat())];

  function chip(label, value, row) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b.dataset.value = value;
    b.setAttribute('aria-pressed', 'false'); row.appendChild(b);
  }
  chip('All', 'all', topicRow);
  allTopics.forEach(t => chip(t, t, topicRow));
  chip('Anything', 'all', fnRow);
  FUNCTIONS.filter(f => SENTENCES.some(s => s.fn === f)).forEach(f => chip(f.replace(/^[A-Z]/, c => c.toLowerCase()), f, fnRow));

  topicRow.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; topic = b.dataset.value; render(); });
  fnRow.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; fn = b.dataset.value; render(); });

  // Audio: mp3 if present, browser voice otherwise
  let currentAudio = null, voice = null;
  function pickVoice() {
    const v = speechSynthesis.getVoices(); if (!v.length) return;
    const gb = v.filter(x => /en-GB/i.test(x.lang));
    voice = gb.find(x => /Daniel|Google UK English|Serena|Kate|Arthur|Martha/i.test(x.name)) || gb[0] || v.find(x => /^en/i.test(x.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function stopAll() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    document.querySelectorAll('.say.playing').forEach(el => el.classList.remove('playing'));
  }
  function speak(text, done) {
    if (!('speechSynthesis' in window)) { done(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; if (voice) u.voice = voice; u.rate = 0.92;
    u.onend = done; u.onerror = done; speechSynthesis.speak(u);
  }
  function play(s, btn) {
    stopAll(); btn.classList.add('playing');
    const done = () => btn.classList.remove('playing');
    if (s.mp3) {
      currentAudio = new Audio('audio/' + s.mp3);
      currentAudio.onended = done;
      currentAudio.onerror = () => { currentAudio = null; speak(s.en, done); };
      currentAudio.play().catch(() => speak(s.en, done));
    } else speak(s.en, done);
  }

  function render() {
    topicRow.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === topic)));
    fnRow.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === fn)));

    const items = SENTENCES.filter(s => (topic === 'all' || topicsOf(s).includes(topic)) && (fn === 'all' || s.fn === fn));
    list.innerHTML = '';
    if (!items.length) { list.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }

    const groups = new Map();
    items.forEach(s => { if (!groups.has(s.lesson)) groups.set(s.lesson, []); groups.get(s.lesson).push(s); });

    groups.forEach((arr, lesson) => {
      const h = document.createElement('div');
      h.className = 'lesson';
      h.innerHTML = 'Lesson · <b></b>'; h.querySelector('b').textContent = lesson;
      list.appendChild(h);
      const ul = document.createElement('ul');
      arr.forEach(s => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.className = 'say';
        b.innerHTML = '<span class="text"></span><span class="play" aria-hidden="true"></span>';
        b.querySelector('.text').textContent = s.en;
        if (fn === 'all') { const t = document.createElement('span'); t.className = 'fn'; t.textContent = s.fn; b.querySelector('.text').appendChild(t); }
        b.addEventListener('click', () => play(s, b));
        li.appendChild(b); ul.appendChild(li);
      });
      list.appendChild(ul);
    });
  }
  render();
})();
</script>
</body>
</html>
