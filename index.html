<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Useful sentences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --mute: #6B6B6B;
    --line: #E6E6E6;
    --lime: #C8F04B;
    --violet: #5B3DF5;
    --chip: #F2F2F2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    font-size: 18px; line-height: 1.3;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header { padding: 22px 18px 10px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  h1 span { display: inline-block; background: var(--lime); padding: 0 6px; border-radius: 6px; }
  header small { display: block; margin-top: 6px; font-size: 13px; color: var(--mute); font-weight: 600; }

  .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 6px 0 2px; border-bottom: 1px solid var(--line); }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); padding: 6px 18px 2px; }
  .row { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding: 4px 18px 10px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; border-radius: 10px;
    background: var(--chip); color: var(--ink);
    padding: 9px 13px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .row.fn .chip[aria-pressed="true"] { background: var(--violet); }
  .chip:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

  main { padding: 8px 12px 48px; }
  .lesson { margin: 18px 6px 8px; font-size: 13px; font-weight: 700; color: var(--mute); }
  .lesson b { color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .say {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: #fff; border: 2px solid var(--ink); border-radius: 14px;
    padding: 12px 12px 12px 14px; text-align: left;
    font: inherit; font-weight: 500; color: inherit; cursor: pointer; min-height: 64px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .say:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .say.playing { background: var(--lime); }
  .say:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
  .text { flex: 1; }
  .fn { display: block; font-size: 12px; color: var(--mute); font-weight: 700; margin-top: 2px; }
  .play {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    background: var(--ink); position: relative;
  }
  .play::after {
    content: ""; position: absolute; left: 15px; top: 11px;
    border-left: 12px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent;
  }
  .say.playing .play { background: var(--violet); }
  .empty { margin: 40px 6px; color: var(--mute); }

  /* Embed mode: one Notion toggle = one screen (?block=stars-2) */
  body.embed header, body.embed .filters { display: none; }
  body.embed main { padding: 4px 10px 14px; }
  body.embed .group { margin: 12px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--violet); }
  body.embed .group:first-child { margin-top: 6px; }
  body.embed ul { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px 12px; padding-right: 4px; }
  body.embed li { display: flex; }
  body.embed .say { font-size: 19px; min-height: 58px; padding: 10px 10px 10px 14px; }
  body.embed .hint { margin: 2px 4px 0; font-size: 12px; font-weight: 700; color: var(--mute); }
</style>
<link rel="stylesheet" href="lesson.css">
</head>
<body>

<div id="viewLesson"></div>

<div id="viewSentences">
<header>
  <h1><span>Useful</span> sentences</h1>
  <small>tap · listen · say it</small>
</header>

<div class="filters">
  <div class="label">Topic</div>
  <div class="row" id="topicRow"></div>
  <div class="label">Useful for...</div>
  <div class="row fn" id="fnRow"></div>
</div>

<main><div id="list"></div></main>
</div>

<nav class="tabbar"><a id="tabLesson" href="#/">Lesson</a><a id="tabSent" href="#/sentences">All sentences</a></nav>

<script src="frases.js"></script>
<script>
(function () {
  const topicRow = document.getElementById('topicRow');
  const fnRow = document.getElementById('fnRow');
  const list = document.getElementById('list');
  let topic = 'all', fn = 'all';

  const topicsOf = s => s.topics || [];
  const known = (typeof TOPICS !== 'undefined') ? TOPICS : [];
  const used = [...new Set(SENTENCES.flatMap(topicsOf))];
  const allTopics = [...known.filter(t => used.includes(t)), ...used.filter(t => !known.includes(t))];
  const fnOrder = [...FUNCTIONS, ...new Set(SENTENCES.map(s => s.fn).filter(f => !FUNCTIONS.includes(f)))];
  const inTopic = s => topic === 'all' || topicsOf(s).includes(topic);

  function chip(label, value, row) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b.dataset.value = value;
    b.setAttribute('aria-pressed', 'false'); row.appendChild(b);
  }
  chip('All', 'all', topicRow);
  allTopics.forEach(t => chip(t, t, topicRow));
  // The "Useful for..." row only offers the functions that exist in the chosen topic
  function buildFnRow() {
    fnRow.innerHTML = '';
    chip('Anything', 'all', fnRow);
    const avail = fnOrder.filter(f => SENTENCES.some(s => s.fn === f && inTopic(s)));
    avail.forEach(f => chip(f.replace(/^[A-Z]/, c => c.toLowerCase()), f, fnRow));
    if (fn !== 'all' && !avail.includes(fn)) fn = 'all';
    fnRow.scrollLeft = 0;
  }
  buildFnRow();

  topicRow.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; topic = b.dataset.value; buildFnRow(); render(); });
  fnRow.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; fn = b.dataset.value; render(); });

  // Audio: mp3 if present, browser voice otherwise
  let currentAudio = null, voice = null;
  function pickVoice() {
    const v = speechSynthesis.getVoices(); if (!v.length) return;
    const gb = v.filter(x => /en-GB/i.test(x.lang));
    voice = gb.find(x => /Daniel|Google UK English|Sonia|Libby|Serena|Kate|Arthur|Martha/i.test(x.name)) || gb[0] || v.find(x => /^en/i.test(x.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function stopAll() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    document.querySelectorAll('.say.playing').forEach(el => el.classList.remove('playing'));
  }
  // Same rule as the mp3 generator: "That's so you!" -> thats-so-you.mp3
  const slug = t => t.toLowerCase().replace(/[\u2019']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60).replace(/-+$/, '');
  function speak(text, done) {
    // Never read English with a non-English voice (a Spanish Windows voice sounds like a joke)
    if (!('speechSynthesis' in window) || !voice) { done(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; if (voice) u.voice = voice; u.rate = 0.92;
    u.onend = done; u.onerror = done;
    setTimeout(() => speechSynthesis.speak(u), 60);
  }
  function play(s, btn) {
    stopAll(); btn.classList.add('playing');
    const done = () => btn.classList.remove('playing');
    // Recorded mp3 first (audio/<slug>.mp3, or the file named in mp3:). Device voice only as a backup.
    let fellBack = false;
    const backup = () => { if (fellBack) return; fellBack = true; currentAudio = null; speak(s.en, done); };
    currentAudio = new Audio('audio/' + (s.mp3 || slug(s.en) + '.mp3'));
    currentAudio.onended = done;
    currentAudio.onerror = backup;
    currentAudio.play().catch(backup);
  }

  function sayButton(s, showFn) {
    const b = document.createElement('button');
    b.className = 'say';
    b.innerHTML = '<span class="text"></span><span class="play" aria-hidden="true"></span>';
    b.querySelector('.text').textContent = s.en;
    if (showFn) { const t = document.createElement('span'); t.className = 'fn'; t.textContent = s.fn; b.querySelector('.text').appendChild(t); }
    b.addEventListener('click', () => play(s, b));
    return b;
  }

  window.US = { sayButton, stopAll };

  // Embed mode: index.html?block=stars-2 (several blocks: ?block=stars-2,stars-3)
  const wanted = (new URLSearchParams(location.search).get('block') || '').split(',').map(x => x.trim()).filter(Boolean);
  if (wanted.length) {
    document.body.classList.add('embed');
    const items = SENTENCES.filter(s => wanted.includes(s.block));
    if (!items.length) { list.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
    const groups = new Map();
    items.forEach(s => { if (!groups.has(s.fn)) groups.set(s.fn, []); groups.get(s.fn).push(s); });
    groups.forEach((arr, name) => {
      const h = document.createElement('div'); h.className = 'group'; h.textContent = name; list.appendChild(h);
      const ul = document.createElement('ul');
      arr.forEach(s => { const li = document.createElement('li'); li.appendChild(sayButton(s, false)); ul.appendChild(li); });
      list.appendChild(ul);
    });
    const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = 'tap · listen · say it'; list.appendChild(hint);
    return;
  }

  function render() {
    topicRow.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === topic)));
    fnRow.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === fn)));

    const items = SENTENCES.filter(s => inTopic(s) && (fn === 'all' || s.fn === fn));
    list.innerHTML = '';
    if (!items.length) { list.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }

    const groups = new Map();
    items.forEach(s => { if (!groups.has(s.lesson)) groups.set(s.lesson, []); groups.get(s.lesson).push(s); });

    groups.forEach((arr, lesson) => {
      const h = document.createElement('div');
      h.className = 'lesson';
      h.innerHTML = 'Lesson · <b></b>'; h.querySelector('b').textContent = lesson;
      list.appendChild(h);
      const ul = document.createElement('ul');
      arr.forEach(s => {
        const li = document.createElement('li');
        li.appendChild(sayButton(s, fn === 'all')); ul.appendChild(li);
      });
      list.appendChild(ul);
    });
  }
  render();
})();
</script>
<script src="lessons.js"></script>
<script src="lesson.js"></script>
</body>
</html>
